services:
  postgres:
    image: postgres:17
    container_name: auth-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
      POSTGRES_USER: ${AUTH_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-postgres}

    ports:
      - "127.0.0.1:${AUTH_DB_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${AUTH_DB_USER:-postgres} -d ${AUTH_DB_NAME:-auth_db}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  user-postgres:
    image: postgres:17
    container_name: user-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${USER_DB_NAME:-zikzak_users}
      POSTGRES_USER: ${USER_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-postgres}

    ports:
      - "127.0.0.1:${USER_DB_PORT:-5433}:5432"

    volumes:
      - user_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${USER_DB_USER:-postgres} -d ${USER_DB_NAME:-zikzak_users}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  chat-postgres:
    image: postgres:17
    container_name: chat-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${CHAT_DB_NAME:-zikzak_chats}
      POSTGRES_USER: ${CHAT_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${CHAT_DB_PASSWORD:-postgres}

    ports:
      - "127.0.0.1:${CHAT_DB_PORT:-5435}:5432"

    volumes:
      - chat_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${CHAT_DB_USER:-postgres} -d ${CHAT_DB_NAME:-zikzak_chats}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  message-postgres:
    image: postgres:17
    container_name: message-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${MESSAGE_DB_NAME:-zikzak_messages}
      POSTGRES_USER: ${MESSAGE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${MESSAGE_DB_PASSWORD:-postgres}

    ports:
      - "127.0.0.1:${MESSAGE_DB_PORT:-5439}:5432"

    volumes:
      - message_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${MESSAGE_DB_USER:-postgres} -d ${MESSAGE_DB_NAME:-zikzak_messages}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafka:
    image: apache/kafka:3.7.1
    container_name: zikzak-kafka
    restart: unless-stopped

    ports:
      - "127.0.0.1:9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s



volumes:
  postgres_data:
  user_postgres_data:
  chat_postgres_data:
  message_postgres_data:

