server:
  port: ${API_GATEWAY_PORT:8090}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://127.0.0.1:8081}
          predicates:
            - Path=/api/v1/auth/**

        - id: user-service
          uri: ${USER_SERVICE_URI:http://127.0.0.1:8082}
          predicates:
            - Path=/api/v1/profiles/**

        - id: message-service
          uri: ${MESSAGE_SERVICE_URI:http://127.0.0.1:8084}
          predicates:
            - Path=/api/v1/chats/*/messages/**

        - id: chat-service
          uri: ${CHAT_SERVICE_URI:http://127.0.0.1:8083}
          predicates:
            - Path=/api/v1/chats/**

management:
  endpoints:
    web:
      exposure:
        include: health,info