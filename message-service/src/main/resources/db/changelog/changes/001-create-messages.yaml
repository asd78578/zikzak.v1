databaseChangeLog:
  - changeSet:
      id: 001-create-messages
      author: zikzak
      changes:
        - createTable:
            tableName: messages
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_messages
                    nullable: false

              - column:
                  name: chat_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: sender_account_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: content
                  type: VARCHAR(4000)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: SENT
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            tableName: messages
            indexName: idx_messages_chat_created_id
            columns:
              - column:
                  name: chat_id
              - column:
                  name: created_at
              - column:
                  name: id

        - createIndex:
            tableName: messages
            indexName: idx_messages_sender_account_id
            columns:
              - column:
                  name: sender_account_id