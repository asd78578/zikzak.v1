server:
  port: 8084

spring:
  application:
    name: message-service

  datasource:
    url: jdbc:postgresql://${MESSAGE_DB_HOST:localhost}:${MESSAGE_DB_PORT:5439}/${MESSAGE_DB_NAME:zikzak_messages}
    username: ${MESSAGE_DB_USER:postgres}
    password: ${MESSAGE_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

security:
  jwt:
    secret: ${JWT_SECRET}

services:
  chat:
    url: ${CHAT_SERVICE_URL:http://127.0.0.1:8083}

app:
  kafka:
    topics:
      message-events: ${MESSAGE_EVENTS_TOPIC:message.events.v1}

management:
  tracing:
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [correlationId=%X{correlationId:-none}] [traceId=%X{traceId:-none}] [spanId=%X{spanId:-none}] [%thread] %logger{36} - %msg%n"
